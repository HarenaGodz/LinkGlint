name: LinkGlint CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Check whitespace
        run: git diff --check

      - name: Build Universal app
        run: ARCHS="x86_64 arm64" ./scripts/build-app.sh

      - name: Verify bundle and architectures
        run: |
          codesign --verify --deep --strict --verbose=2 dist/LinkGlint.app
          lipo -archs dist/LinkGlint.app/Contents/MacOS/LinkGlint
          lipo -archs dist/LinkGlint.app/Contents/Library/PrivilegedHelperTools/LinkGlintHelper
          test "$(lipo -archs dist/LinkGlint.app/Contents/MacOS/LinkGlint)" = "x86_64 arm64"
          test "$(lipo -archs dist/LinkGlint.app/Contents/Library/PrivilegedHelperTools/LinkGlintHelper)" = "x86_64 arm64"
